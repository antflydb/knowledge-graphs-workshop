title: Apollo 13 communications and Review Board
passages:
  max_bytes: 550
  max_words: 75
  overlap_words: 10
extraction:
  entities:
  - person
  - role
  - spacecraft
  - component
  - problem
  - procedure
  threshold: 0.5
  relations:
    part_of:
      description: HEAD component is part of TAIL component or spacecraft.
      head_types:
      - component
      tail_types:
      - component
      - spacecraft
    affects:
      description: HEAD problem affects TAIL component or spacecraft.
      head_types:
      - problem
      tail_types:
      - component
      - spacecraft
    suspected_cause_of:
      description: HEAD component or problem is suggested, hypothesized or suspected
        as a cause of TAIL problem, not determined.
      head_types:
      - component
      - problem
      tail_types:
      - problem
    determined_cause_of:
      description: HEAD component or problem is explicitly determined to have caused
        TAIL problem.
      head_types:
      - component
      - problem
      tail_types:
      - problem
    mitigates:
      description: HEAD procedure or component reduces or resolves TAIL problem.
      head_types:
      - procedure
      - component
      tail_types:
      - problem
relation_decision:
  instruction: 'Choose the explicit directed HEAD-to-TAIL relationship. Preserve uncertainty:
    contemporaneous hypotheses are not board determinations. A report quoting an earlier
    suspicion remains suspicion. Do not infer causation from co-mention. Context is
    provenance, not extra facts; CC is a role, not one person.'
# Launch (GET 000:00:00): transcript lines are stamped with ground elapsed time from here.
transcript_epoch: '1970-04-11T19:13:00Z'
# The dashboard reads the transcript as a feed of messages, checked against the Board's report.
feed:
  messages: apollo13:air-to-ground
  record: apollo13:review-board
