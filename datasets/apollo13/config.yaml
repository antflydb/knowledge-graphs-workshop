      head_types:
      - component
      - problem
      tail_types:
      - problem
    determined_cause_of:
      description: HEAD component or problem is explicitly determined to have caused
        TAIL problem.
      head_types:
      - component
      - problem
      tail_types:
      - problem
    mitigates:
      description: HEAD procedure or component reduces or resolves TAIL problem.
      head_types:
      - procedure
      - component
      tail_types:
      - problem
relation_decision:
