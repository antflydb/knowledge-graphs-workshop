title: Eleven Portland Oregon pizza places
passages:
  max_bytes: 550
  max_words: 75
  overlap_words: 10
extraction:
  entities:
  - restaurant
  - location
  - menu_item
  - ingredient
  - dietary_option
  - pizza_style
  threshold: 0.5
  relations:
    located_in:
      description: HEAD restaurant is located at TAIL location.
      head_types:
      - restaurant
      tail_types:
      - location
    serves:
      description: HEAD restaurant serves TAIL menu item.
      head_types:
      - restaurant
      tail_types:
      - menu_item
    contains_ingredient:
      description: HEAD menu item contains TAIL ingredient.
      head_types:
      - menu_item
      tail_types:
      - ingredient
    has_dietary_option:
      description: HEAD restaurant or menu item explicitly offers TAIL dietary option.
      head_types:
      - restaurant
      - menu_item
      tail_types:
      - dietary_option
    has_style:
      description: HEAD restaurant or menu item has TAIL pizza style.
      head_types:
      - restaurant
      - menu_item
      tail_types:
      - pizza_style
relation_decision:
  instruction: Choose the explicitly supported directed HEAD-to-TAIL relationship.
    Do not infer ingredients, dietary or allergen safety from absence. Do not derive
    ownership from branding or metadata. Source context is provenance, not additional
    facts.
# Not shown in the web dashboard yet; still buildable from the CLI.
dashboard: false
